apiVersion: v1
kind: Service
metadata:
  name: flint-v5p-wave-b-svc
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: flint-v5p-opt-multilora
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flint-v5p-opt-multilora
  namespace: default
  labels:
    app: flint-v5p-opt-multilora
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: flint-v5p-opt-multilora
      annotations:
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: default
      subdomain: flint-v5p-wave-b-svc
      terminationGracePeriodSeconds: 10
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-nodepool: YOUR_TPU_NODEPOOL
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - {key: google.com/tpu, operator: Exists, effect: NoSchedule}
      - {key: cloud.google.com/gke-spot, operator: Exists, effect: NoSchedule}
      - {key: cloud.google.com/gke-queued, operator: Exists, effect: NoSchedule}
      containers:
      - name: sglang-v5p
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/sglang-torchtpu-diffusion:v0.2.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          ulimit -c 0 || true
          mkdir -p /workspace/logs /dev/shm/torch_tpu_cache/default /dev/shm/jax_compile_cache
          echo "[v5p-wave-b] Host=$(hostname) Index=${JOB_COMPLETION_INDEX:-0} Bootstrapping..."
          if [ -f /models/models/RecursiveSI/flint/sglang/flint_sglang-0.1.4-py3-none-any.whl ]; then
            pip install --no-deps /models/models/RecursiveSI/flint/sglang/flint_sglang-0.1.4-py3-none-any.whl
          fi
          cp -f /models/flint-v5p-wave-b/* /workspace/
          python3 /workspace/patch_flint_sglang_tpu.py
          gcc -shared -fPIC -O2 -o /workspace/metadata_hook.so /workspace/metadata_hook.c -ldl
          grep -q "127.0.0.1 metadata.google.internal" /etc/hosts || echo "127.0.0.1 metadata.google.internal" >> /etc/hosts
          nohup python3 /workspace/v5p_mock_metadata.py --port 18080 >/workspace/logs/mock_metadata.log 2>&1 &
          sleep 2
          python3 -u /workspace/run_v5p_singlehost_worker.py > /workspace/logs/wave_b_worker.log 2>&1
        env:
        - {name: PJRT_DEVICE, value: "TPU"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        resources:
          requests: {google.com/tpu: "4", cpu: "32", memory: 240Gi}
          limits: {google.com/tpu: "4"}
        volumeMounts:
        - {name: models-gcs, mountPath: /models}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: models-gcs
        persistentVolumeClaim: {claimName: tpu-models-gcs-pvc}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 320Gi}
