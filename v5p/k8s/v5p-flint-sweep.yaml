apiVersion: v1
kind: Service
metadata:
  name: flint-serve-v5p-sweep-svc
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: flint-serve-v5p-sweep
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flint-serve-v5p-sweep
  namespace: default
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: flint-serve-v5p-sweep
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: default
      subdomain: flint-serve-v5p-sweep-svc
      terminationGracePeriodSeconds: 10
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-nodepool: flint-tpu-v5p-spot-4n
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: sglang-bench
        image: us-central1-docker.pkg.dev/diesel-patrol-382622/vllm/sglang-torchtpu-diffusion:v0.2.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -euo pipefail
          ulimit -c 0 || true
          mkdir -p /workspace/scripts
          python3 - <<'PY'
          import json, pathlib, urllib.parse, urllib.request
          req = urllib.request.Request(
              "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token",
              headers={"Metadata-Flavor": "Google"},
          )
          tok = json.loads(urllib.request.urlopen(req, timeout=10).read().decode())["access_token"]
          bucket = "ank-usc1-bucket-314837540096"
          for fn in ("quantize_flint_fp8.py", "patch_flint_sglang_tpu.py", "v5p_mock_metadata.py", "flint_v5p_gateway.py", "bench_flint_v5p.py"):
              obj = urllib.parse.quote(f"flint-serving-scripts/v5p/{fn}", safe="")
              r = urllib.request.Request(
                  f"https://storage.googleapis.com/storage/v1/b/{bucket}/o/{obj}?alt=media",
                  headers={"Authorization": f"Bearer {tok}"},
              )
              data = urllib.request.urlopen(r, timeout=30).read()
              dst = pathlib.Path("/workspace/scripts") / fn
              dst.write_bytes(data)
              dst.chmod(0o755)
          print("Downloaded v5p benchmark scripts successfully.", flush=True)
          PY
          python3 /workspace/scripts/bench_flint_v5p.py \
            --mode full_sweep \
            --gcs-bucket ank-usc1-bucket-314837540096 \
            --run-id v5p16_sweep_r1
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
