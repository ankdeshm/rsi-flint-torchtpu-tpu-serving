apiVersion: v1
kind: Service
metadata:
  name: flint-v7x-16-spot-svc
  namespace: default
  labels:
    app: flint-v7x-16-spot-runner
spec:
  clusterIP: None
  selector:
    app: flint-v7x-16-spot-runner
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flint-v7x-16-spot-runner
  namespace: default
  labels:
    app: flint-v7x-16-spot-runner
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 500
  template:
    metadata:
      labels:
        app: flint-v7x-16-spot-runner
      annotations:
        gke-gcsfuse/volumes: "true"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: default
      subdomain: flint-v7x-16-spot-svc
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-nodepool: YOUR_TPU_NODEPOOL
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-queued"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: flint-tpu
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/sglang-torchtpu-diffusion:v0.2.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          ulimit -c 0 || true
          mount -o remount,size=1000G /dev/shm || true
          mkdir -p /dev/shm/flint_work /dev/shm/hf_cache /dev/shm/xla_cache /dev/shm/tmp /workspace/logs /workspace/results /models/flint-v7x-serving-results
          echo "[pod-${JOB_COMPLETION_INDEX:-0}] Host=$(hostname) IP=$(hostname -I | awk '{print $1}') Bootstrapping..."
          # 1. Install flint_sglang wheel
          if [ -f /models/models/RecursiveSI/flint/sglang/flint_sglang-0.1.4-py3-none-any.whl ]; then
            pip install --no-deps /models/models/RecursiveSI/flint/sglang/flint_sglang-0.1.4-py3-none-any.whl
          fi
          # 2. Copy serving & benchmark scripts from GCS mount and patch flint_sglang
          if [ -d /models/flint-v7x-scripts ]; then
            cp -f /models/flint-v7x-scripts/* /workspace/ || true
          fi
          if [ -f /workspace/patch_flint_sglang_tpu.py ]; then
            python3 /workspace/patch_flint_sglang_tpu.py
          fi
          # 3. Compile metadata_hook.so and start mock_metadata.py on 127.0.0.1:80
          if [ -f /workspace/metadata_hook.c ]; then
            gcc -shared -fPIC -O2 -o /workspace/metadata_hook.so /workspace/metadata_hook.c -ldl
          fi
          grep -q "127.0.0.1 metadata.google.internal" /etc/hosts || echo "127.0.0.1 metadata.google.internal" >> /etc/hosts
          if [ -f /workspace/mock_metadata.py ]; then
            nohup python3 /workspace/mock_metadata.py >/workspace/mock_metadata.log 2>&1 &
          fi
          # 4. Stage BF16 Flint checkpoint to /dev/shm/flint in parallel
          python3 - <<'PY'
          import concurrent.futures, pathlib, shutil, time
          src = pathlib.Path("/models/models/RecursiveSI/flint")
          dst = pathlib.Path("/dev/shm/flint")
          dst.mkdir(parents=True, exist_ok=True)
          marker = dst / ".staged_ok"
          if not marker.exists() and src.exists():
              t0 = time.time()
              files = [p for p in src.rglob("*") if p.is_file() and ".cache" not in p.parts]
              def copy_one(p):
                  rel = p.relative_to(src)
                  out = dst / rel
                  out.parent.mkdir(parents=True, exist_ok=True)
                  if out.exists() and out.stat().st_size == p.stat().st_size:
                      return p.stat().st_size
                  shutil.copyfile(p, out)
                  return p.stat().st_size
              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
                  total = sum(ex.map(copy_one, files))
              marker.write_text("ok\n")
              dt = max(time.time() - t0, 1e-3)
              print(f"Staged BF16 {total/1e9:.2f} GB to /dev/shm/flint in {dt:.1f}s ({total/1e9/dt:.2f} GB/s)", flush=True)
          else:
              print("/dev/shm/flint already staged", flush=True)
          PY
          # 5. Convert BF16 -> Block-FP8 [128, 128] in /dev/shm/flint-fp8 (~4.7s across 15 CPU workers)
          if [ -f /workspace/convert_flint_fp8.py ]; then
            python3 /workspace/convert_flint_fp8.py --src /dev/shm/flint --dst /dev/shm/flint-fp8 --workers 15
          fi
          df -h /dev/shm
          echo "[pod-${JOB_COMPLETION_INDEX:-0}] READY_FOR_BENCHMARKS"
          sleep 86400
        env:
        - name: PJRT_DEVICE
          value: "TPU"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        resources:
          requests:
            google.com/tpu: "4"
            memory: "256Gi"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: ramtmp
          mountPath: /tmp
        - name: models-gcs
          mountPath: /models
      volumes:
      - name: dshm
        hostPath:
          path: /dev/shm
          type: Directory
      - name: ramtmp
        emptyDir:
          medium: Memory
      - name: models-gcs
        persistentVolumeClaim:
          claimName: tpu-models-gcs-pvc
